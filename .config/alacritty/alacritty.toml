# ───────────────────────────────────────────────────────────────
# ⚡ Alacritty Config - Flash Theme
# ───────────────────────────────────────────────────────────────

[general]
live_config_reload = true

# ─────────────────────────────────────────────────────────────
# Window
# ─────────────────────────────────────────────────────────────
[window]
padding = { x = 12, y = 12 }
opacity = 0.95
dimensions = { columns = 120, lines = 30 }
startup_mode = "Windowed"
decorations = "Full"

# ─────────────────────────────────────────────────────────────
# Font - FiraCode Nerd Font
# ─────────────────────────────────────────────────────────────
[font]
size = 12.0

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font"
style = "Italic"

# ─────────────────────────────────────────────────────────────
# Scrolling
# ─────────────────────────────────────────────────────────────
[scrolling]
history = 10000
multiplier = 3

# ─────────────────────────────────────────────────────────────
# NEOTERRA Color Scheme — Sovereign Dark
# ─────────────────────────────────────────────────────────────
[colors.primary]
background = "#0B0E14"
foreground = "#E6E9EF"

[colors.cursor]
cursor = "#F0B90B"
text   = "#0B0E14"

[colors.selection]
background = "#D6A419"
text       = "#0B0E14"

# Normal colors
[colors.normal]
black   = "#0B0E14"
red     = "#8F1D2C"
green   = "#2E7D32"
yellow  = "#D6A419"
blue    = "#1E3A5F"
magenta = "#6B2D5E"
cyan    = "#1A5F6B"
white   = "#AAB2C5"

# Bright colors
[colors.bright]
black   = "#1F2638"
red     = "#C53030"
green   = "#43A047"
yellow  = "#F0B90B"
blue    = "#2979CC"
magenta = "#9B4D8E"
cyan    = "#26A69A"
white   = "#E6E9EF"

# ─────────────────────────────────────────────────────────────
# Cursor
# ─────────────────────────────────────────────────────────────
[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 750

# ─────────────────────────────────────────────────────────────
# Selection
# ─────────────────────────────────────────────────────────────
[selection]
save_to_clipboard = true

# ─────────────────────────────────────────────────────────────
# Terminal / Shell
# ─────────────────────────────────────────────────────────────
[terminal]
shell = { program = "/usr/bin/zsh", args = [] }

# ─────────────────────────────────────────────────────────────
# Keybindings
# ─────────────────────────────────────────────────────────────
[keyboard]
bindings = [
  { key = "C", mods = "Control|Shift", action = "Copy"  },
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "N", mods = "Control|Shift", action = "SpawnNewInstance" }
]

# ─────────────────────────────────────────────────────────────
# Bell
# ─────────────────────────────────────────────────────────────
[bell]
animation = "EaseOutExpo"
duration = 0
