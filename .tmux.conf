# ───────────────────────────────────────────────────────────────
# NEOTERRA — Tmux Config
# ───────────────────────────────────────────────────────────────

# Terminal Einstellungen
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',alacritty:RGB,xterm-256color:RGB'
set -g default-shell /usr/bin/zsh

# Basics
set -g mouse on
set -g history-limit 10000
set-option -g allow-rename off
set -g status-interval 1
set -sg escape-time 0

# Start bei 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ───────────────────────────────────────────────────────────────
# ⚡ Prefix (Ctrl-a)
# ───────────────────────────────────────────────────────────────

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ───────────────────────────────────────────────────────────────
# ⚡ Keybindings
# ───────────────────────────────────────────────────────────────

# Reload
bind r source-file ~/.tmux.conf \; display-message " NEOTERRA reloaded"

# Splits im aktuellen Pfad
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Neues Fenster im aktuellen Pfad
bind c new-window -c "#{pane_current_path}"

# Vim-style Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ───────────────────────────────────────────────────────────────
# NEOTERRA — Farben
# ───────────────────────────────────────────────────────────────

# Statusleiste Position
set -g status on
set -g status-position bottom
set -g status-justify left

# NEOTERRA Basis
set -g status-style "bg=#0B0E14,fg=#AAB2C5"

# Linke Seite — NEOTERRA Symbol + Session Name (rounded pill)
set -g status-left-length 50
set -g status-left "#[bg=#0B0E14]#[fg=#D6A419]#[bg=#D6A419]#[fg=#0B0E14]#[bold] ^ #S #[nobold]#[bg=#0B0E14]#[fg=#D6A419] "

# Rechte Seite — Zeit + Datum (rounded pills)
# Hinweis: kein Komma innerhalb #[...] in #{?...} verwenden!
set -g status-right-length 120
set -g status-right "#{?client_prefix,#[bg=#0B0E14]#[fg=#8F1D2C]#[bg=#8F1D2C]#[fg=#E6E9EF]#[bold]  PREFIX #[nobold]#[bg=#0B0E14]#[fg=#8F1D2C] ,}#[bg=#0B0E14]#[fg=#2A3A5A]#[bg=#2A3A5A]#[fg=#AAB2C5] %H:%M #[bg=#0B0E14]#[fg=#2A3A5A] #[bg=#0B0E14]#[fg=#D6A419]#[bg=#D6A419]#[fg=#0B0E14]#[bold] %d.%m.%Y #[nobold]#[bg=#0B0E14]#[fg=#D6A419]"

# Fenster Status — rounded tabs
set -g window-status-format "#[bg=#0B0E14]#[fg=#2A3350]#[bg=#2A3350]#[fg=#6B7280] #I  #W #[bg=#0B0E14]#[fg=#2A3350]"
set -g window-status-current-format "#[bg=#0B0E14]#[fg=#D6A419]#[bg=#D6A419]#[fg=#0B0E14]#[bold] #I  #W #[nobold]#[bg=#0B0E14]#[fg=#D6A419]"
set -g window-status-separator " "

# Pane Borders
set -g pane-border-style "fg=#1F2638"
set -g pane-active-border-style "fg=#D6A419"
set -g pane-border-lines single

# Messages
set -g message-style "bg=#D6A419,fg=#0B0E14,bold"
set -g message-command-style "bg=#1F2638,fg=#AAB2C5"

# Mode (copy / visual)
setw -g mode-style "bg=#D6A419,fg=#0B0E14,bold"

# Clock
setw -g clock-mode-colour "#D6A419"

# Bell
set -g visual-bell off
set -g bell-action none
set -g visual-activity off
setw -g monitor-activity off

# ───────────────────────────────────────────────────────────────
# ⚡ TPM Plugins
# ───────────────────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# TPM laden (installieren mit prefix + I)
run '~/.tmux/plugins/tpm/tpm'
